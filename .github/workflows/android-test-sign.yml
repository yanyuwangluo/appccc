name: Android CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]

jobs:
  build-android:
    name: Build APK (CI)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Generate Flutter platform folders
        working-directory: mobile_template
        run: flutter create . --platforms=android,ios

      - name: Generate Android widget native files
        run: |
          python3 scripts/setup_android_widgets.py

      - name: Install dependencies
        working-directory: mobile_template
        run: flutter pub get

      - name: Build APK (release)
        working-directory: mobile_template
        run: flutter build apk --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: mobile_template/build/app/outputs/flutter-apk/app-release.apk
